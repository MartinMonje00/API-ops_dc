services:
  db-service:
    image: mariadb:10.11
    container_name: mariadb_ops_local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./SCHEMATICS.sql:/docker-entrypoint-initdb.d/SCHEMATICS.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - dc_network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth_service_local
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
    depends_on:
      db-service:
        condition: service_healthy
    networks:
      - dc_network
  
  ops-service:
    build:
      context: ./services/ops-service
      dockerfile: Dockerfile
    container_name: ops_service_local
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
    volumes:
      - ./backups_data:/app/backups
    depends_on:
      db-service:
        condition: service_healthy
    networks:
      - dc_network
  
  telemetry-service:
    build:
      context: ./services/telemetry-service
      dockerfile: Dockerfile
    container_name: telemetry_service_local
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - PORT=3002
    depends_on:
      db-service:
        condition: service_healthy
    networks:
      - dc_network

volumes:
  db_data:

networks:
  dc_network:
    driver: bridge