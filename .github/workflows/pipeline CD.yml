name: CD - Main Branch & Production Deploy (Self-Hosted)

on:
    push:
        branches: [ main ]

jobs:
    deploy:
        runs-on: self-hosted

        steps:
          - name: Checkout del codigo
            uses: actions/checkout@v4

          - name: Sincronizacion y despliegue de las APIs
            run: |
              TARGET_DIR=/home/admincrm/API

              mkdir -p "$TARGET_DIR"

              rsync -avq --delete \
                --exclude='.git/' \
                --exclude='.github/' \
                --exclude='.gitignore' \
                --exclude='README.md' \
                --exclude='docker-compose.yml' \
                --exclude='SCHEMATICS.sql' \
                --exclude='**/Dockerfile' \
                --exclude='**/.env' \
                --exclude='**/node_modules/' \
                --exclude='**/.dockerignore' \
                ./ "$TARGET_DIR/"

              cd "$TARGET_DIR"

              cd services/auth-service && npm install --omit=dev && cd ../..
              cd services/ops-service && npm install --omit=dev && cd ../..
              cd services/telemetry-service && npm install --omit=dev && cd ../..

              pm2 reload api-auth api-ops api-telemetry