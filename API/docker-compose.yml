services:
  api-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: api_ops_local
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - .env
    depends_on:
      db-service:
        condition: service_healthy
  
  db-service:
    image: mariadb:10.11
    container_name: mariadb_ops_local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./SCHEMATICS.sql:/docker-entrypoint-initdb.d/SCHEMATICS.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db_data:
